[project]
name = "zeitflow"
version = "2.0.0"
description = "Mobile Zeiterfassung für Montageteams über Telegram mit wöchentlichem Stundennachweis"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::telegram.warnings.PTBUserWarning"]
